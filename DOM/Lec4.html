<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Aur Code | DOM </title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    // Both do the same Taske just the second one is little optimize
    // now here also when i want to add som property with them like strong by using the first method the
    // we will get the property like python will become bold but in second the whole text will come even if we write tag
    function addLanguage1(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }

    addLanguage1("<strong>python</strong>")
    addLanguage1("TypeScript")

    function addOptiLanuage(langName){
        const li = document.createElement('li')               // Here, you're appending the text node inside the <li> element, At this point, the <li> exists in memory, but it hasn't been added to your webpage's list yet.
        li.appendChild(document.createTextNode(langName))     // Here, you're appending the entire <li> element inside the element with the class language.
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanuage("Node JS")
    addOptiLanuage("<strong>python</strong>")

    // So why is the second approach called optimized?
    // There are three main reasons:
    // 1. Safer: It doesn't interpret user-provided text as HTML, reducing the risk of cross-site scripting (XSS) when displaying untrusted input.
    // 2. Avoids HTML parsing: createTextNode() creates a text node directly instead of parsing the string as HTML.
    // 3. Clearer intention: It tells the reader that you want to insert plain text, not HTML markup.

    // edit
    const secondLang = document.querySelector("li:nth-child(2)")
    // secondLang.innerHTML = "MoJo"
    const newLi = document.createElement('li')
    newLi.textContent = "Mojo"
    secondLang.replaceWith(newLi)


    // remove
    const lastLanuage = document.querySelector('li:last-child')
    lastLanuage.remove()
</script>
</html>
