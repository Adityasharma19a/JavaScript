<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #212121;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Top navigation bar */
        nav {
            background-color: #f0f0f0;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        nav a,
        nav button {
            padding: 10px 25px;
            border: 1px solid black;
            border-radius: 4px;
            color: black;
            background-color: #e0e0e0;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        /* Center content */
        .center {
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #banner {
            font-size: 16px;
            margin-bottom: 0;
        }

        #clock {
            background-color: orange;
            color: black;
            width: 100px;
            min-height: 40px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            nav a,
            nav button {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>

</head>
<body>
    <div class="center">
        <div id="banner">Your local time</div>
        <div id="clock"></div>
    </div>

    <script src="pro3.js"></script>
</body>
</html>
